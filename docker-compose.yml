services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-safeway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-safeway_analytics}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    user: "0:0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
      POSTGRES_USER: ${POSTGRES_USER:-safeway}
      POSTGRES_DB: ${POSTGRES_DB:-safeway_analytics}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ./scripts/backup-postgres-loop.sh:/usr/local/bin/backup-loop.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-loop.sh"]

  api:
    build: ./api
    restart: unless-stopped

    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PINO_LOG_LEVEL: ${PINO_LOG_LEVEL:-info}
      PORT: "4000"
      
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

      EMAIL: ${EMAIL}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}

      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      POSTGRES_USER: ${POSTGRES_USER:-safeway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-safeway_analytics}

      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"

    depends_on:
      db:
        condition: service_healthy
      backup:
        condition: service_started

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}

    restart: unless-stopped

    environment:
      API_PROXY_TARGET: http://api:4000

    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:4173"

volumes:
  postgres_data: