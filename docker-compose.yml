services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-safeway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-safeway_analytics}

    ports:
      - "${POSTGRES_PORT:-5433}:5433"

    volumes:
      - postgres_data:/var/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped

    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PINO_LOG_LEVEL: ${PINO_LOG_LEVEL:-info}
      PORT: "4000"

      POSTGRES_USER: ${POSTGRES_USER:-safeway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-safeway_analytics}

      POSTGRES_HOST: db
      POSTGRES_PORT: 5433

      POSTGRESQL_CONNECTION_STRING: ${POSTGRESQL_CONNECTION_STRING:-postgresql://$$POSTGRES_USER:$$POSTGRES_PASSWORD@db:5432/$$POSTGRES_DB}

    ports:
      - "${API_PORT:-4000}:4000"

    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}

    restart: unless-stopped

    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:80"

    depends_on:
      - api

volumes:
  postgres_data: