name: Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-api:
    name: Build API image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t safeway-api:latest ./api

      - name: Save API image
        run: docker save safeway-api:latest -o safeway-api.tar

      - name: Upload API image artifact
        uses: actions/upload-artifact@v4
        with:
          name: safeway-api-image
          path: safeway-api.tar


  build-dashboard:
    name: Build dashboard image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build dashboard image
        run: docker build -t safeway-dashboard:latest ./dashboard

      - name: Save dashboard image
        run: docker save safeway-dashboard:latest -o safeway-dashboard.tar

      - name: Upload dashboard image artifact
        uses: actions/upload-artifact@v4
        with:
          name: safeway-dashboard-image
          path: safeway-dashboard.tar


  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest

    needs:
      - build-api
      - build-dashboard

    steps:
      - name: Download API image
        uses: actions/download-artifact@v4
        with:
          name: safeway-api-image

      - name: Download dashboard image
        uses: actions/download-artifact@v4
        with:
          name: safeway-dashboard-image

      - name: Upload Docker Compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 2222
          source: "docker-compose.yml"
          target: "/home/mody/safeway/"

      - name: Upload API image
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 2222
          source: "safeway-api.tar"
          target: "/home/mody/safeway/dashboard/api/"

      - name: Upload dashboard image
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 2222
          source: "safeway-dashboard.tar"
          target: "/home/mody/safeway/dashboard/dashboard/"

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 2222
          script: |
            docker load -i /home/mody/safeway/dashboard/api/safeway-api.tar
            docker load -i /home/mody/safeway/dashboard/dashboard/safeway-dashboard.tar

            cd /home/mody/safeway
            docker compose --env-file .env up -d